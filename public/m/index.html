  /* THE APP ON A LARGE SCREEN. No scaling — a monitor gets the app at its own
     pixel size, so nothing turns huge. But the app lays itself out from the
     width it is given, and given 1900px a sign-in field becomes 1850px wide
     and a wheel 900px across, which is not the app; it is the app stretched.
     So on a large screen the app is given a reading-width canvas — up to
     1000px — centred in the window, full height, with the same black on either
     side. There is no edge to it: black on black, the page IS the app, and its
     elements sit at the size they were designed for.

     The BODY is that canvas, not a div inside it: the app's sheets, the paywall
     and the voice screen are modals, and react-native-web mounts a modal as a
     child of <body>, outside #root. A transform on body makes it their
     containing block, so they open over the canvas exactly as the app does. */

  body { background: #000; margin: 0 auto; overflow: hidden; height: 100%; max-width: 1000px; transform: translateZ(0); }
  #root { height: 100%; }

  input:autofill { background: transparent; color: #fff; }
  /* a phone shows no scrollbar tracks; Windows draws a pale one on every
     scrolling list and on a multi-line box — hidden, the lists still scroll */
  * { scrollbar-width: none; }
  *::-webkit-scrollbar { width: 0; height: 0; display: none; }
