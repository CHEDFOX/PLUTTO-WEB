<style>
  /* THE STAGE. On a phone the app is the page. On anything wider it stands in a
     phone-shaped column, dark around it, the way it is designed to be held —
     the app's layout is a phone's, and stretched to a desktop it is not the
     app. The column is 430pt wide (a large phone) and as tall as the window.

     The BODY is the stage, not a div inside it: the app's sheets, the paywall
     and the voice screen are modals, and react-native-web mounts a modal as a
     child of <body>, outside #root. A transform on body makes it the containing
     block for their position:fixed, so they open over the column and not over
     the whole window. */
  html { background: #07070a; }
  body { background: #000; }
  @media (min-width: 560px) {
    html { display: flex; justify-content: center; }
    body { position: relative; width: 430px; height: 100vh; margin: 0; overflow: hidden; transform: translateZ(0);
           box-shadow: 0 0 0 1px rgba(255,255,255,.08), 0 40px 120px -30px rgba(0,0,0,.9); }
    #root { height: 100%; }
  }
</style>
<script>

  // pin both to the stage, so every screen lays out for the column it draws in.

      Object.defineProperty(window, 'visualViewport', { get: function () { return vv; }, configurable: true });
    } catch (e) {}
  })();
</script>
